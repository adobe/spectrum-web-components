name: Publish Packages (gen1)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM dist-tag for a throwaway gen1 snapshot'
        required: false
        default: 'next'
        type: choice
        options:
          - next
          - snapshot-test
  push:
    branches:
      - main
    paths:
      - '1st-gen/**'

# Scoped to this workflow so a gen1 run and a gen2 run never block on each other -
# both used to share the same `publish-${{ github.ref }}` group string.
concurrency:
  group: publish-gen1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changesets:
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changesets
        id: check
        run: |
          # This workflow is 1st-gen only, always - independent of 2nd-gen in every
          # trigger. 2nd-gen has its own changesets setup in 2nd-gen/.changeset/ and
          # its own workflow, publish-gen2.yml.
          GEN1_COUNT=$(find 1st-gen/.changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')

          if [ "$GEN1_COUNT" -eq 0 ]; then
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "No changesets found - skipping snapshot publish"
          else
            echo "has_changesets=true" >> $GITHUB_OUTPUT
            echo "Found $GEN1_COUNT 1st-gen changeset(s)"
          fi

  # Throwaway snapshot publish under `next`/`snapshot-test`. Only runs when 1st-gen
  # changesets are pending; never touches main, commits, or opens a PR. Runs alongside
  # the `version-pr`/`publish` jobs below without conflicting (separate jobs/runners).
  snapshot:
    needs: check-changesets
    if: needs.check-changesets.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write # Required for OIDC trusted publishing (1st-gen)
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job

      - name: Determine snapshot tag
        id: extract-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          WORKFLOW_TAG="${INPUT_TAG:-next}"
          echo "tag=$WORKFLOW_TAG" >> $GITHUB_OUTPUT
          echo "Using npm tag: $WORKFLOW_TAG"

      - name: Verify OIDC token
        id: npm-auth
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "✓ OIDC token is available for 1st-gen trusted publishing"
          else
            echo "✗ OIDC token NOT available - trusted publishing will fail"
            exit 1
          fi

      - name: Generate custom elements manifests
        run: yarn workspace @spectrum-web-components/1st-gen custom-element-json

      - name: Confirm build artifacts
        run: yarn workspace @spectrum-web-components/1st-gen build:confirm

      - name: Version gen1 packages (snapshot)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: (cd 1st-gen && yarn changeset version --snapshot ${{ steps.extract-tag.outputs.tag }})

      - name: Capture released versions
        id: versions
        run: |
          BUNDLE_VERSION=$(node -p "require('./1st-gen/tools/bundle/package.json').version")
          echo "bundle=$BUNDLE_VERSION" >> $GITHUB_OUTPUT

      - name: Refresh lockfile and rebuild
        run: |
          yarn install --refresh-lockfile
          yarn build

      - name: Publish gen1 packages
        if: steps.npm-auth.outcome == 'success'
        run: (cd 1st-gen && yarn changeset publish --no-git-tag --tag ${{ steps.extract-tag.outputs.tag }})

      # Gated only by this job running at all (needs.check-changesets.outputs.has_changesets
      # == 'true' at the job level) - the old workflow's separate has_1st_gen_changesets
      # output was always identical to has_changesets for this gen1-only workflow, so no
      # extra conditional is needed here.
      - name: Build React wrappers
        run: yarn workspace @spectrum-web-components/1st-gen build:react

      - name: Publish React wrappers
        env:
          TAG: ${{ steps.extract-tag.outputs.tag }}
        run: |
          PUBLISH_CMD="npm publish --tag $TAG --access public"

          retry_publish() {
            local dir=$1
            local max_attempts=3
            local attempt=1

            while [ $attempt -le $max_attempts ]; do
              echo "Publishing $dir (attempt $attempt/$max_attempts)..."
              if (cd "$dir" && $PUBLISH_CMD); then
                echo "✓ Successfully published $dir"
                return 0
              else
                if [ $attempt -lt $max_attempts ]; then
                  local wait_time=$((2 ** attempt))
                  echo "✗ Publish failed, retrying in ${wait_time}s..."
                  sleep $wait_time
                else
                  echo "✗ Failed to publish $dir after $max_attempts attempts"
                  return 1
                fi
              fi
              attempt=$((attempt + 1))
            done
          }

          cd 1st-gen/react
          for dir in */; do
            retry_publish "$dir" || exit 1
          done

      - name: Publish summary
        if: always()
        env:
          TAG: ${{ steps.extract-tag.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          AUTH_OUTCOME: ${{ steps.npm-auth.outcome }}
          BUNDLE_VERSION: ${{ steps.versions.outputs.bundle }}
        run: |
          echo "## Publish summary (snapshot)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | \`${EVENT_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **NPM tag** | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Actor** | @${ACTOR} |" >> $GITHUB_STEP_SUMMARY

          if [ -n "$BUNDLE_VERSION" ]; then
            echo "## Versions released" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Generation | Package | Version |" >> $GITHUB_STEP_SUMMARY
            echo "|------------|---------|---------|" >> $GITHUB_STEP_SUMMARY
            echo "| gen1 | \`@spectrum-web-components/bundle\` | \`${BUNDLE_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$AUTH_OUTCOME" == "success" ]; then
            echo "✅ Publish completed with tag \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Publish failed — NPM authentication did not succeed" >> $GITHUB_STEP_SUMMARY
          fi

  # Version-then-PR. No npm-publish environment gate here - nothing is published yet,
  # just a bot-authored PR a human reviews and merges. Uses peter-evans/create-pull-request
  # instead of changesets/action's built-in PR management, since that derives its branch
  # name only from the base branch (`changeset-release/main`) - gen1 and gen2 would
  # collide on the same branch. Accepts workflow_dispatch too, so this can be re-run by
  # hand if a run fails, without needing an empty commit to main.
  version-pr:
    needs: check-changesets
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.check-changesets.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the Version PR branch
      pull-requests: write # opens/updates the Version PR
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job

      - name: Version gen1 packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yarn workspace @spectrum-web-components/1st-gen changelog:1st-gen
          (cd 1st-gen && yarn changeset version)
          yarn install --refresh-lockfile

      - name: Open or update the gen1 Version PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: release gen1 packages'
          title: 'chore: release gen1 packages'
          branch: changeset-release/1st-gen
          base: main
          delete-branch: true
          add-paths: |
            1st-gen
            yarn.lock

      - name: Version PR summary
        run: |
          echo "## Publish summary (gen1)" >> $GITHUB_STEP_SUMMARY
          echo "📝 Version PR opened/updated at \`changeset-release/1st-gen\` - nothing published yet" >> $GITHUB_STEP_SUMMARY

  # Real publish, once the Version PR above has merged (no pending changesets left).
  # Only this job sits behind the npm-publish environment's required-reviewer approval,
  # since it's the only one that actually publishes to npm. Accepts workflow_dispatch
  # too, so a failed publish can be retried by hand instead of needing an empty commit.
  publish:
    needs: check-changesets
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.check-changesets.outputs.has_changesets == 'false'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write # Required for OIDC trusted publishing (1st-gen)
      contents: write # pushes the release git tag
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job

      - name: Verify OIDC token
        id: npm-auth
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "✓ OIDC token is available for 1st-gen trusted publishing"
          else
            echo "✗ OIDC token NOT available - trusted publishing will fail"
            exit 1
          fi

      - name: Generate custom elements manifests
        run: yarn workspace @spectrum-web-components/1st-gen custom-element-json

      - name: Confirm build artifacts
        run: yarn workspace @spectrum-web-components/1st-gen build:confirm

      # The git-tag-existence guard is what makes this safe to re-run on every subsequent
      # ordinary push once a release has gone out (changeset publish is separately
      # idempotent for the changeset-tracked packages). Each React wrapper is also
      # checked individually before publishing - the tag is only created after every
      # wrapper succeeds, so without this a partial failure would leave some wrappers
      # already published with no tag, and the next run would fail republishing them.
      - name: Publish gen1 packages
        id: publish
        run: |
          RELEASED_VERSION=$(node -p "require('./1st-gen/packages/button/package.json').version")
          if git rev-parse "gen1-$RELEASED_VERSION" >/dev/null 2>&1; then
            echo "gen1-$RELEASED_VERSION already released - nothing to do."
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          yarn install --refresh-lockfile
          yarn build
          (cd 1st-gen && yarn changeset publish --no-git-tag)
          yarn workspace @spectrum-web-components/1st-gen build:react
          cd 1st-gen/react
          for dir in */; do
            pkg_name=$(node -p "require('./${dir}package.json').name")
            if npm view "${pkg_name}@${RELEASED_VERSION}" version >/dev/null 2>&1; then
              echo "✓ ${pkg_name}@${RELEASED_VERSION} already published, skipping"
              continue
            fi
            attempt=1
            max_attempts=3
            until (cd "$dir" && npm publish --access public); do
              if [ $attempt -ge $max_attempts ]; then
                echo "✗ Failed to publish $dir after $max_attempts attempts"
                exit 1
              fi
              wait_time=$((2 ** attempt))
              echo "✗ Publish failed for $dir, retrying in ${wait_time}s..."
              sleep $wait_time
              attempt=$((attempt + 1))
            done
          done
          cd ../..
          git config user.name "github-actions-bot"
          git config user.email "support+actions@github.com"
          node ./scripts/create-git-tag.js gen1
          echo "published=true" >> $GITHUB_OUTPUT

      - name: Publish summary
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          echo "## Publish summary (gen1)" >> $GITHUB_STEP_SUMMARY
          if [ "$PUBLISHED" == "true" ]; then
            echo "✅ Published a new release" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No pending changesets and nothing new to publish" >> $GITHUB_STEP_SUMMARY
          fi
