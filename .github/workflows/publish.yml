name: Publish Packages (1st-gen)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM dist-tag for a throwaway snapshot'
        required: false
        default: 'next'
        type: choice
        options:
          - next
          - snapshot-test
  pull_request:
    types: [labeled, synchronize]
  push:
    branches:
      - main

# 1st-gen-scoped group: this and publish-2nd-gen.yml used to share the literal string
# `publish-${{ github.ref }}`, which is a repo-wide concurrency key, not scoped to the
# workflow file it's declared in - so the two workflows' entire runs (not just their
# release jobs) serialized against each other on every push to main. That made sense
# under the old shared-changeset/direct-push model (both workflows wrote to the same
# main branch and had to avoid racing), but it directly works against this redesign's
# goal of fully independent gen1/gen2 release streams: neither writes to anything the
# other touches anymore (separate Version PR branches, separate dist-tags, separate npm
# packages), so there's nothing left to protect by blocking one generation's run behind
# the other's.
concurrency:
  group: publish-1st-gen-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changesets:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'snapshot-release'))
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changesets
        id: check
        run: |
          # This workflow is 1st-gen only, always - independent of 2nd-gen in every
          # trigger. 2nd-gen has its own changesets setup in 2nd-gen/.changeset/ and
          # its own workflow, publish-2nd-gen.yml.
          GEN1_COUNT=$(find 1st-gen/.changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')

          if [ "$GEN1_COUNT" -eq 0 ]; then
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "No changesets found - skipping snapshot publish"
          else
            echo "has_changesets=true" >> $GITHUB_OUTPUT
            echo "Found $GEN1_COUNT 1st-gen changeset(s)"
          fi

  # Throwaway snapshot publish: gated on has_changesets, same as check-changesets - so
  # this only runs on a push to main that happens to have 1st-gen changesets pending at
  # that moment, not on every push. `next` is therefore not a true continuous build of
  # every main commit; it only refreshes when a push coincides with a pending changeset.
  # Also runs for manual workflow_dispatch and snapshot-release-labeled PRs. Never
  # touches main, never commits, never opens a PR. Runs alongside (not instead of) the
  # `release` job below - both are triggered by the same push event but never conflict
  # (separate jobs/runners, and the run-level concurrency group only dedupes overlapping
  # *workflow runs*, not jobs within one run).
  snapshot:
    needs: check-changesets
    if: needs.check-changesets.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write # Required for OIDC trusted publishing (1st-gen)
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job

      - name: Determine snapshot tag
        id: extract-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" == "pull_request" ]; then
            WORKFLOW_TAG="snapshot-test"
          else
            WORKFLOW_TAG="${INPUT_TAG:-next}"
          fi
          echo "tag=$WORKFLOW_TAG" >> $GITHUB_OUTPUT
          echo "Using npm tag: $WORKFLOW_TAG"

      - name: Verify OIDC token and configure NPM authentication
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "✓ OIDC token is available for 1st-gen trusted publishing"
          else
            echo "✗ OIDC token NOT available - trusted publishing will fail"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Generate custom elements manifests
        run: yarn workspace @spectrum-web-components/1st-gen custom-element-json

      - name: Confirm build artifacts
        run: yarn workspace @spectrum-web-components/1st-gen build:confirm

      - name: Version 1st-gen packages (snapshot)
        run: (cd 1st-gen && yarn changeset version --snapshot ${{ steps.extract-tag.outputs.tag }})

      - name: Capture released versions
        id: versions
        run: |
          BUNDLE_VERSION=$(node -p "require('./1st-gen/tools/bundle/package.json').version")
          echo "bundle=$BUNDLE_VERSION" >> $GITHUB_OUTPUT

      - name: Refresh lockfile and rebuild
        run: |
          yarn install --refresh-lockfile
          yarn build

      - name: Publish 1st-gen packages
        if: steps.npm-auth.outcome == 'success'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: (cd 1st-gen && yarn changeset publish --no-git-tag --tag ${{ steps.extract-tag.outputs.tag }})

      # Gated only by this job running at all (needs.check-changesets.outputs.has_changesets
      # == 'true' at the job level) - the old workflow's separate has_1st_gen_changesets
      # output was always identical to has_changesets for this gen1-only workflow, so no
      # extra conditional is needed here.
      - name: Build React wrappers
        run: yarn workspace @spectrum-web-components/1st-gen build:react

      - name: Publish React wrappers
        env:
          TAG: ${{ steps.extract-tag.outputs.tag }}
        run: |
          PUBLISH_CMD="npm publish --tag $TAG --access public"

          retry_publish() {
            local dir=$1
            local max_attempts=3
            local attempt=1

            while [ $attempt -le $max_attempts ]; do
              echo "Publishing $dir (attempt $attempt/$max_attempts)..."
              if (cd "$dir" && $PUBLISH_CMD); then
                echo "✓ Successfully published $dir"
                return 0
              else
                if [ $attempt -lt $max_attempts ]; then
                  local wait_time=$((2 ** attempt))
                  echo "✗ Publish failed, retrying in ${wait_time}s..."
                  sleep $wait_time
                else
                  echo "✗ Failed to publish $dir after $max_attempts attempts"
                  return 1
                fi
              fi
              attempt=$((attempt + 1))
            done
          }

          cd 1st-gen/react
          for dir in */; do
            retry_publish "$dir" || exit 1
          done

      - name: Publish summary
        if: always()
        env:
          TAG: ${{ steps.extract-tag.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          ACTOR: ${{ github.actor }}
          AUTH_OUTCOME: ${{ steps.npm-auth.outcome }}
          BUNDLE_VERSION: ${{ steps.versions.outputs.bundle }}
        run: |
          echo "## Publish summary (snapshot)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$EVENT_NAME" == "pull_request" ]; then
            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Trigger** | Pull request |" >> $GITHUB_STEP_SUMMARY
            echo "| **PR** | #${PR_NUMBER} — ${PR_TITLE} |" >> $GITHUB_STEP_SUMMARY
            echo "| **Branch** | \`${HEAD_REF}\` → \`${BASE_REF}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **NPM tag** | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Author** | @${PR_AUTHOR} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Trigger** | Manual dispatch |" >> $GITHUB_STEP_SUMMARY
            echo "| **NPM tag** | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| **Actor** | @${ACTOR} |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -n "$BUNDLE_VERSION" ]; then
            echo "## Versions released" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Generation | Package | Version |" >> $GITHUB_STEP_SUMMARY
            echo "|------------|---------|---------|" >> $GITHUB_STEP_SUMMARY
            echo "| 1st gen | \`@spectrum-web-components/bundle\` | \`${BUNDLE_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$AUTH_OUTCOME" == "success" ]; then
            echo "✅ Publish completed with tag \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Publish failed — NPM authentication did not succeed" >> $GITHUB_STEP_SUMMARY
          fi

  # Real release: version-then-PR, then publish once that PR merges. Every push to main
  # either versions and opens/updates a dedicated Version PR (changesets pending) or
  # publishes (no changesets pending, because that PR was just merged). No direct write
  # to main outside of a reviewed PR merge; no branch lock needed.
  #
  # This does NOT use changesets/action's own built-in PR management. That action derives
  # its PR branch name solely from the base branch (`changeset-release/<baseBranch>`) with
  # no per-cwd namespacing - since this workflow and publish-2nd-gen.yml both target the
  # same `main` base, two changesets/action calls would both compute the identical branch
  # name `changeset-release/main` and silently overwrite each other's Version PR content
  # whenever both generations have pending changesets (not just under a race - any two
  # pushes, even hours apart, collide the same way). peter-evans/create-pull-request@v6
  # takes an explicit `branch:` input, so each generation gets its own dedicated branch.
  release:
    needs: check-changesets
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write # Required for OIDC trusted publishing (1st-gen)
      contents: write # commits the Version PR branch + pushes the release git tag
      pull-requests: write # opens/updates the Version PR
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job

      - name: Verify OIDC token and configure NPM authentication
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "✓ OIDC token is available for 1st-gen trusted publishing"
          else
            echo "✗ OIDC token NOT available - trusted publishing will fail"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Generate custom elements manifests
        run: yarn workspace @spectrum-web-components/1st-gen custom-element-json

      - name: Confirm build artifacts
        run: yarn workspace @spectrum-web-components/1st-gen build:confirm

      - name: Version 1st-gen packages
        if: needs.check-changesets.outputs.has_changesets == 'true'
        run: |
          yarn workspace @spectrum-web-components/1st-gen changelog:1st-gen
          (cd 1st-gen && yarn changeset version)
          yarn install --refresh-lockfile

      - name: Open or update the 1st-gen Version PR
        if: needs.check-changesets.outputs.has_changesets == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: release 1st-gen packages'
          title: 'chore: release 1st-gen packages'
          branch: changeset-release/1st-gen
          base: main
          delete-branch: true
          add-paths: |
            1st-gen
            yarn.lock

      - name: Version PR summary
        if: needs.check-changesets.outputs.has_changesets == 'true'
        run: |
          echo "## Publish summary (1st-gen)" >> $GITHUB_STEP_SUMMARY
          echo "📝 Version PR opened/updated at \`changeset-release/1st-gen\` - nothing published yet" >> $GITHUB_STEP_SUMMARY

      # No pending changesets: either nothing to do, or the Version PR above was just
      # merged (its changesets were consumed) - publish whatever is now on main. The
      # git-tag-existence guard is what makes this safe to re-run on every subsequent
      # ordinary push once a release has gone out (changeset publish is separately
      # idempotent for the changeset-tracked packages, but the raw `npm publish` calls
      # for React wrappers are not, so the tag check guards the whole script).
      - name: Publish 1st-gen packages
        if: needs.check-changesets.outputs.has_changesets == 'false'
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: |
          RELEASED_VERSION=$(node -p "require('./1st-gen/packages/button/package.json').version")
          if git rev-parse "v$RELEASED_VERSION" >/dev/null 2>&1; then
            echo "v$RELEASED_VERSION already released - nothing to do."
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          yarn install --refresh-lockfile
          yarn build
          (cd 1st-gen && yarn changeset publish --no-git-tag)
          yarn workspace @spectrum-web-components/1st-gen build:react
          cd 1st-gen/react
          for dir in */; do
            attempt=1
            max_attempts=3
            until (cd "$dir" && npm publish --access public); do
              if [ $attempt -ge $max_attempts ]; then
                echo "✗ Failed to publish $dir after $max_attempts attempts"
                exit 1
              fi
              wait_time=$((2 ** attempt))
              echo "✗ Publish failed for $dir, retrying in ${wait_time}s..."
              sleep $wait_time
              attempt=$((attempt + 1))
            done
          done
          cd ../..
          git config user.name "github-actions-bot"
          git config user.email "support+actions@github.com"
          node ./1st-gen/scripts/create-git-tag.js
          echo "published=true" >> $GITHUB_OUTPUT

      - name: Publish summary
        if: needs.check-changesets.outputs.has_changesets == 'false' && always()
        env:
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          echo "## Publish summary (1st-gen)" >> $GITHUB_STEP_SUMMARY
          if [ "$PUBLISHED" == "true" ]; then
            echo "✅ Published a new release" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No pending changesets and nothing new to publish" >> $GITHUB_STEP_SUMMARY
          fi
