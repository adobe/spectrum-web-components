name: Publish Packages (1st-gen)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM dist-tag for a throwaway snapshot (e.g., next, snapshot-test)'
        required: false
        default: 'next'
  pull_request:
    types: [labeled, synchronize]
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changesets:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'snapshot-release'))
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for changesets
        id: check
        run: |
          # This workflow is 1st-gen only, always - independent of 2nd-gen in every
          # trigger. 2nd-gen has its own changesets setup in 2nd-gen/.changeset/ and
          # its own workflow, publish-2nd-gen.yml.
          GEN1_COUNT=$(ls -1 1st-gen/.changeset/*.md 2>/dev/null | grep -v README | wc -l | tr -d ' ')

          if [ "$GEN1_COUNT" -eq 0 ]; then
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "No changesets found - skipping snapshot publish"
          else
            echo "has_changesets=true" >> $GITHUB_OUTPUT
            echo "Found $GEN1_COUNT 1st-gen changeset(s)"
          fi

  # Throwaway snapshot publish: workflow_dispatch (manual snapshot) and
  # snapshot-release-labeled PRs. Never touches main, never commits, never opens a PR.
  snapshot:
    needs: check-changesets
    if: needs.check-changesets.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write # Required for OIDC trusted publishing (1st-gen)
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job

      - name: Determine snapshot tag
        id: extract-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" == "pull_request" ]; then
            WORKFLOW_TAG="snapshot-test"
          else
            WORKFLOW_TAG="${INPUT_TAG:-next}"
          fi
          echo "tag=$WORKFLOW_TAG" >> $GITHUB_OUTPUT
          echo "Using npm tag: $WORKFLOW_TAG"

      - name: Verify OIDC token and configure NPM authentication
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "✓ OIDC token is available for 1st-gen trusted publishing"
          else
            echo "✗ OIDC token NOT available - trusted publishing will fail"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Build all packages
        run: yarn build

      - name: Version 1st-gen packages (snapshot)
        run: (cd 1st-gen && yarn changeset version --snapshot ${{ steps.extract-tag.outputs.tag }})

      - name: Refresh lockfile and rebuild
        run: |
          yarn install --refresh-lockfile
          yarn build

      - name: Publish 1st-gen packages
        if: steps.npm-auth.outcome == 'success'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: (cd 1st-gen && yarn changeset publish --no-git-tag --tag ${{ steps.extract-tag.outputs.tag }})

  # Real release: version-PR-then-publish, driven entirely by changesets/action.
  # Every push to main either opens/updates the Version PR (changesets pending) or
  # publishes (no changesets pending, because that PR was just merged). No direct
  # write to main outside of a reviewed PR merge; no branch lock needed.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write # Required for OIDC trusted publishing (1st-gen)
      contents: write # changesets/action commits the Version PR branch + (script) pushes the release git tag
      pull-requests: write # changesets/action opens/updates the Version PR
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job

      - name: Verify OIDC token and configure NPM authentication
        id: npm-auth
        env:
          NPM_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: |
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "✓ OIDC token is available for 1st-gen trusted publishing"
          else
            echo "✗ OIDC token NOT available - trusted publishing will fail"
            exit 1
          fi
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Build all packages
        run: yarn build

      - name: Generate custom elements manifests
        run: yarn workspace @spectrum-web-components/1st-gen custom-element-json

      - name: Confirm build artifacts
        run: yarn workspace @spectrum-web-components/1st-gen build:confirm

      - name: Version or publish 1st-gen packages
        id: changesets
        uses: changesets/action@v1
        with:
          cwd: 1st-gen
          commit: 'chore: release 1st-gen packages'
          title: 'chore: release 1st-gen packages'
          version: yarn changelog:global && yarn changeset version
          publish: |
            RELEASED_VERSION=$(node -p "require('./packages/button/package.json').version")
            if git rev-parse "v$RELEASED_VERSION" >/dev/null 2>&1; then
              echo "v$RELEASED_VERSION already released - nothing to do."
              exit 0
            fi
            (cd .. && yarn install --refresh-lockfile && yarn build)
            yarn changeset publish --no-git-tag
            yarn build:react
            cd react
            for dir in */; do
              attempt=1
              max_attempts=3
              until (cd "$dir" && npm publish --access public); do
                if [ $attempt -ge $max_attempts ]; then
                  echo "✗ Failed to publish $dir after $max_attempts attempts"
                  exit 1
                fi
                wait_time=$((2 ** attempt))
                echo "✗ Publish failed for $dir, retrying in ${wait_time}s..."
                sleep $wait_time
                attempt=$((attempt + 1))
              done
            done
            cd ..
            node ./scripts/create-git-tag.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}

      - name: Publish summary
        if: always()
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          echo "## Publish summary (1st-gen)" >> $GITHUB_STEP_SUMMARY
          if [ "$PUBLISHED" == "true" ]; then
            echo "✅ Published a new release" >> $GITHUB_STEP_SUMMARY
          elif [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "📝 Version PR #${PR_NUMBER} opened/updated - nothing published yet" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No pending changesets and nothing new to publish" >> $GITHUB_STEP_SUMMARY
          fi
