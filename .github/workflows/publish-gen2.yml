name: Publish Packages (gen2)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM dist-tag for a throwaway gen2 snapshot'
        required: false
        default: 'next'
        type: choice
        options:
          - next
          - snapshot-test
  push:
    branches:
      - main
    paths:
      - '2nd-gen/**'

# Scoped to this workflow so a gen1 run and a gen2 run never block on each other -
# both used to share the same `publish-${{ github.ref }}` group string.
concurrency:
  group: publish-gen2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changesets:
    runs-on: ubuntu-latest
    # Deliberately NOT branch-gated: the snapshot job below is allowed to run from any
    # branch (dispatch a feature branch to publish a throwaway build of it). The
    # main-only restriction lives on version-pr and publish instead, so the real release
    # path still cannot run from anywhere but main.
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
      needs_publish: ${{ steps.check.outputs.needs_publish }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags so the needs_publish idempotency check below can see them

      - name: Check for gen2 changesets
        id: check
        run: |
          # Independent of 1st-gen in every trigger - this workflow never reads
          # 1st-gen/.changeset/.
          COUNT=$(find 2nd-gen/.changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')

          if [ "$COUNT" -ne 0 ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
            echo "needs_publish=false" >> $GITHUB_OUTPUT
            echo "Found $COUNT 2nd-gen changeset(s)"
            exit 0
          fi

          echo "has_changesets=false" >> $GITHUB_OUTPUT

          # Mirror the publish job's git-tag guard here so the npm-publish environment
          # only parks for reviewer approval when there's genuinely a new release to
          # ship. The environment gate fires before the publish job's first step runs,
          # so an in-step guard can't stop the approval prompt - any changeset-less push
          # to 2nd-gen/** would otherwise ping reviewers for a "release" that just no-ops.
          RELEASED_VERSION=$(node -p "require('./2nd-gen/packages/swc/package.json').version")
          if git rev-parse "gen2-$RELEASED_VERSION" >/dev/null 2>&1; then
            echo "needs_publish=false" >> $GITHUB_OUTPUT
            echo "gen2-$RELEASED_VERSION already released - no publish approval needed"
          else
            echo "needs_publish=true" >> $GITHUB_OUTPUT
            echo "gen2-$RELEASED_VERSION not yet released - publish approval will be requested"
          fi

  # Throwaway snapshot publish under `next`/`snapshot-test`. Manual dispatch only - never
  # runs on push, so an ordinary release push can't trigger it. It never commits, pushes,
  # tags, or opens a PR, and `permissions: contents: read` makes that structural rather
  # than a convention.
  #
  # Dispatch it from ANY branch (Actions -> Run workflow -> pick the branch) to publish a
  # throwaway build of that branch for a consumer to try before it merges. Only this job
  # is branch-agnostic; version-pr and publish are pinned to main. The branch needs this
  # workflow file, so feature branches cut before this landed must merge main in first.
  #
  # gen2 lives in changesets' persistent pre mode (`2nd-gen/.changeset/pre.json`, tag
  # `beta`), and changesets refuses `--snapshot` while that file is present ("Snapshot
  # release is not allowed in pre mode"). This job therefore deletes pre.json from its
  # own ephemeral checkout before versioning. That copy dies with the runner: the
  # committed pre state on `main` is never modified or pushed back, so the beta channel's
  # version accounting (initialVersions + consumed changesets) is untouched. Snapshot
  # versions are `<calculated>-<tag>.<datetime>` per this gen's `snapshot` config, so they
  # can never collide with a real `2.0.0-beta.N` or with the eventual stable `2.0.0`.
  snapshot:
    needs: check-changesets
    if: >-
      github.event_name == 'workflow_dispatch' &&
      needs.check-changesets.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read # snapshot never writes back - no commit, tag, or PR
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job

      - name: Determine snapshot tag
        id: extract-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          WORKFLOW_TAG="${INPUT_TAG:-next}"
          echo "tag=$WORKFLOW_TAG" >> $GITHUB_OUTPUT
          echo "Using npm tag: $WORKFLOW_TAG"

      - name: Verify NPM authentication
        id: npm-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org

      - name: Leave pre mode for this runner only
        run: |
          # Ephemeral by construction: this checkout is discarded when the job ends and
          # nothing below commits or pushes. Removing the file locally is the only thing
          # that lets `changeset version --snapshot` run at all while gen2 is in pre mode.
          rm -f 2nd-gen/.changeset/pre.json

      - name: Version gen2 packages (snapshot)
        working-directory: 2nd-gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: yarn changeset version --snapshot ${{ steps.extract-tag.outputs.tag }}

      - name: Capture snapshot versions
        id: versions
        run: |
          CORE_VERSION=$(node -p "require('./2nd-gen/packages/core/package.json').version")
          SWC_VERSION=$(node -p "require('./2nd-gen/packages/swc/package.json').version")
          ICONS_VERSION=$(node -p "require('./2nd-gen/packages/icons/package.json').version")
          echo "core=$CORE_VERSION" >> $GITHUB_OUTPUT
          echo "swc=$SWC_VERSION" >> $GITHUB_OUTPUT
          echo "icons=$ICONS_VERSION" >> $GITHUB_OUTPUT

      - name: Refresh lockfile and rebuild
        run: |
          yarn install --refresh-lockfile
          yarn build

      - name: Publish gen2 packages (snapshot)
        if: steps.npm-auth.outcome == 'success'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        working-directory: 2nd-gen
        run: yarn changeset publish --no-git-tag --tag ${{ steps.extract-tag.outputs.tag }}

      - name: Snapshot summary
        if: always()
        env:
          TAG: ${{ steps.extract-tag.outputs.tag }}
          CORE_VERSION: ${{ steps.versions.outputs.core }}
          SWC_VERSION: ${{ steps.versions.outputs.swc }}
          ICONS_VERSION: ${{ steps.versions.outputs.icons }}
          AUTH_OUTCOME: ${{ steps.npm-auth.outcome }}
        run: |
          echo "## Snapshot summary (gen2)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **NPM tag** | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          [ -n "$SWC_VERSION" ] && echo "| **@adobe/spectrum-wc** | \`${SWC_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          [ -n "$CORE_VERSION" ] && echo "| **@adobe/spectrum-wc-core** | \`${CORE_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          [ -n "$ICONS_VERSION" ] && echo "| **@adobe/spectrum-wc-icons** | \`${ICONS_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$AUTH_OUTCOME" == "success" ]; then
            echo "✅ Throwaway snapshot published under \`${TAG}\`. The \`beta\` channel and its pre-release state are unchanged." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Snapshot failed — NPM authentication did not succeed" >> $GITHUB_STEP_SUMMARY
          fi

  # Version-then-PR for the persistent pre-release version format (2.0.0-beta.N). No
  # npm-publish environment gate here - nothing is published yet, just a bot-authored PR
  # a human reviews and merges. Uses peter-evans/create-pull-request instead of
  # changesets/action's built-in PR management, since that derives its branch name only
  # from the base branch (`changeset-release/main`) - gen1 and gen2 would collide on the
  # same branch.
  version-pr:
    needs: check-changesets
    # Main-only: check-changesets is no longer branch-gated (so snapshot can run from a
    # feature branch), so the real release path carries that restriction itself.
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.check-changesets.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the Version PR branch
      pull-requests: write # opens/updates the Version PR
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job

      - name: Version gen2 packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f 2nd-gen/.changeset/pre.json ]; then
            (cd 2nd-gen && yarn changeset pre enter beta)
          fi
          (cd 2nd-gen && yarn changeset version)
          yarn install --refresh-lockfile

      - name: Open or update the gen2 Version PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: release gen2 packages #gen2-publish'
          title: 'chore: release gen2 packages (beta) #gen2-publish'
          branch: changeset-release/2nd-gen
          base: main
          delete-branch: true
          add-paths: |
            2nd-gen
            yarn.lock

      - name: Version PR summary
        run: |
          echo "## Publish summary (gen2)" >> $GITHUB_STEP_SUMMARY
          echo "📝 Version PR opened/updated at \`changeset-release/2nd-gen\` - nothing published yet" >> $GITHUB_STEP_SUMMARY

  # Real publish, once the Version PR above has merged (no pending changesets left).
  # Only this job sits behind the npm-publish environment's required-reviewer approval,
  # since it's the only one that actually publishes to npm.
  publish:
    needs: check-changesets
    # Main-only: check-changesets is no longer branch-gated (so snapshot can run from a
    # feature branch), so the real release path carries that restriction itself.
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.check-changesets.outputs.has_changesets == 'false' &&
      needs.check-changesets.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # pushes the release git tag
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job

      - name: Verify NPM authentication
        id: npm-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org

      # The git-tag-existence guard is what makes this safe to re-run on every subsequent
      # ordinary push once a release has gone out - mirrors gen1's guard.
      - name: Publish gen2 packages
        if: steps.npm-auth.outcome == 'success'
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: |
          RELEASED_VERSION=$(node -p "require('./2nd-gen/packages/swc/package.json').version")
          if git rev-parse "gen2-$RELEASED_VERSION" >/dev/null 2>&1; then
            echo "gen2-$RELEASED_VERSION already released - nothing to do."
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          yarn install --refresh-lockfile
          yarn build
          # No --tag here: changesets forbids a custom dist-tag while in pre mode
          # (throws "Releasing under custom tag is not allowed in pre mode", exit 1),
          # so `changeset publish` ships to the pre tag (beta).
          (cd 2nd-gen && yarn changeset publish --no-git-tag)
          # Then move npm's `latest` dist-tag onto the just-published version for each
          # public gen2 package, with npm directly - the supported way to reach `latest`
          # from pre mode without editing changesets' internal pre.json state.
          while IFS= read -r pkg_json; do
            is_private=$(node -p "!!require('./$pkg_json').private")
            [ "$is_private" = "true" ] && continue
            name=$(node -p "require('./$pkg_json').name")
            version=$(node -p "require('./$pkg_json').version")
            echo "Pointing latest -> $name@$version"
            npm dist-tag add "$name@$version" latest
          done < <(find 2nd-gen/packages -maxdepth 2 -name package.json -not -path '*/node_modules/*')
          git config user.name "github-actions-bot"
          git config user.email "support+actions@github.com"
          node ./scripts/create-git-tag.js gen2
          echo "published=true" >> $GITHUB_OUTPUT

      - name: Publish summary
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.npm-auth.outcome }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          echo "## Publish summary (gen2)" >> $GITHUB_STEP_SUMMARY
          if [ "$PUBLISHED" == "false" ]; then
            echo "ℹ️ Current version already published - nothing new to ship" >> $GITHUB_STEP_SUMMARY
          elif [ "$AUTH_OUTCOME" == "success" ]; then
            echo "✅ Publish step ran - check the changeset publish output above for what shipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Publish failed — NPM authentication did not succeed" >> $GITHUB_STEP_SUMMARY
          fi
