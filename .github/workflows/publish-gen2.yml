name: Publish Packages (gen2)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM dist-tag for the throwaway snapshot. Not `next` - that channel is fed by main, so a branch build under it would mislead anyone installing @next.'
        required: false
        default: 'snapshot'
        type: choice
        options:
          - snapshot
          - snapshot-test
  push:
    branches:
      - main
    paths:
      - 'gen2/**'

# Scoped to this workflow so a gen1 run and a gen2 run never block on each other -
# both used to share the same `publish-${{ github.ref }}` group string. Keyed on the ref,
# so snapshots of two different feature branches run in parallel and a main release still
# serializes against itself.
concurrency:
  group: publish-gen2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changesets:
    runs-on: ubuntu-latest
    # Only feeds version-pr/publish (the main-only release path), so gate it to main. The
    # snapshot job does not need it - it synthesizes its own changeset - so a feature-branch
    # dispatch skips straight to snapshot without running this.
    if: github.ref == 'refs/heads/main'
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
      needs_publish: ${{ steps.check.outputs.needs_publish }}
    steps:
      # Always main (this job is gated to main above), so the changeset count reflects the
      # release path. The feature-branch snapshot job does its own checkout.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need tags so the needs_publish idempotency check below can see them

      - name: Check for gen2 changesets
        id: check
        run: |
          # Independent of 1st-gen in every trigger - this workflow never reads
          # 1st-gen/.changeset/.
          # In pre mode `changeset version` leaves consumed changesets on disk and lists
          # them in pre.json, so only files missing from that list are still pending.
          # Counting every *.md would never reach 0 after a release PR merges, so the
          # version-pr job would keep re-running with nothing left to version, and the
          # publish job would never see a clean state.
          COUNT=$(node -e "
            const fs = require('fs');
            const dir = 'gen2/.changeset';
            const preFile = dir + '/pre.json';
            const consumed = new Set(
              fs.existsSync(preFile)
                ? JSON.parse(fs.readFileSync(preFile, 'utf8')).changesets
                : []
            );
            const pending = fs
              .readdirSync(dir)
              .filter((f) => f.endsWith('.md') && f !== 'README.md')
              .filter((f) => !consumed.has(f.replace(/\.md\$/, '')));
            console.log(pending.length);
          ")

          if [ "$COUNT" -ne 0 ]; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
            echo "Found $COUNT gen2 changeset(s)"
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "No pending gen2 changesets"
          fi

          # Mirror the publish job's git-tag guard here so the npm-publish environment
          # only parks for reviewer approval when there's genuinely a new release to
          # ship. The environment gate fires before the publish job's first step runs,
          # so an in-step guard can't stop the approval prompt - any push to gen2/** that
          # doesn't need a release would otherwise ping reviewers for one that just no-ops.
          RELEASED_VERSION=$(node -p "require('./gen2/packages/swc/package.json').version")
          if git rev-parse "gen2-$RELEASED_VERSION" >/dev/null 2>&1; then
            echo "needs_publish=false" >> $GITHUB_OUTPUT
            echo "gen2-$RELEASED_VERSION already released - no publish approval needed"
          else
            echo "needs_publish=true" >> $GITHUB_OUTPUT
            echo "gen2-$RELEASED_VERSION not yet released - publish approval will be requested"
          fi

  # Throwaway snapshot publish under the `snapshot` dist-tag. Manual dispatch only - never
  # runs on push, so an ordinary release push can't trigger it. It never commits, pushes,
  # tags, or opens a PR, and `permissions: contents: read` makes that structural rather
  # than a convention.
  #
  # Feature-branch-only by design. Run it from your feature branch (Actions -> Run
  # workflow -> pick the branch); it snapshots whatever ref it was dispatched on. It
  # refuses to run from `main` (see the `if` below) - main ships via the beta flow, never
  # a throwaway snapshot. workflow_dispatch requires repo write access and only targets
  # in-repo branches, so fork code can never reach this job or the npm token.
  #
  # gen2 lives in changesets' persistent pre mode (`gen2/.changeset/pre.json`, tag
  # `beta`), and changesets refuses `--snapshot` while that file is present ("Snapshot
  # release is not allowed in pre mode"). This job therefore deletes pre.json from its
  # own ephemeral checkout before versioning. That copy dies with the runner: the
  # committed pre state on `main` is never modified or pushed back, so the beta channel's
  # version accounting (initialVersions + consumed changesets) is untouched. Snapshot
  # versions are `0.0.0-<tag>.<datetime>` (`snapshot.useCalculatedVersion: false`), so they
  # sort below any real `2.x` and can't satisfy a consumer's `^2.0.0-beta.x` range - a
  # calculated `2.0.0-<tag>` would have won that resolution.
  snapshot:
    # Dispatch-triggered and never from main: a snapshot is only for a feature branch. A
    # dispatch from main is a real manual release and flows to version-pr/publish instead.
    # No changeset gate - a feature branch can be snapshotted any time, even with nothing
    # pending; a throwaway changeset is synthesized below so there's always a version to
    # publish.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read # snapshot never writes back - no commit, tag, or PR
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The dispatched feature branch itself (github.ref). No cross-branch checkout,
          # so there's nothing to point at a fork.
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job
        with:
          build-command: yarn build:gen2

      - name: Determine snapshot tag
        id: extract-tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          WORKFLOW_TAG="${INPUT_TAG:-snapshot}"
          echo "tag=$WORKFLOW_TAG" >> $GITHUB_OUTPUT
          echo "Using npm tag: $WORKFLOW_TAG"

      - name: Publish snapshot
        uses: ./.github/actions/gen2-snapshot
        with:
          tag: ${{ steps.extract-tag.outputs.tag }}
          npm-token: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Automatic snapshot of every gen2 push to main, published under the `next` dist-tag
  # with no reviewer approval. Same steps as `snapshot` above (shared through the
  # gen2-snapshot action); the only differences are the trigger, the fixed `next` tag, and
  # that this job has no `environment`, so it never waits on the npm-publish approval that
  # gates the real beta publish. It still never commits, pushes, tags, or opens a PR.
  # ADOBE_BOT_NPM_TOKEN is an org-level secret, not scoped to the npm-publish environment,
  # so the token is available without one.
  snapshot-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read # snapshot never writes back - no commit, tag, or PR
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job
        with:
          build-command: yarn build:gen2

      - name: Publish snapshot
        uses: ./.github/actions/gen2-snapshot
        with:
          tag: next
          npm-token: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Version-then-PR for the persistent pre-release version format (2.0.0-beta.N). No
  # npm-publish environment gate here - nothing is published yet, just a bot-authored PR
  # a human reviews and merges. Uses peter-evans/create-pull-request instead of
  # changesets/action's built-in PR management, since that derives its branch name only
  # from the base branch (`changeset-release/main`) - gen1 and gen2 would collide on the
  # same branch.
  version-pr:
    needs: check-changesets
    # Main-only, matching check-changesets. The snapshot job runs from a feature branch
    # (github.ref != main) and doesn't depend on check-changesets, so the ref check alone
    # keeps the release path and the snapshot path apart.
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.check-changesets.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # commits the Version PR branch
      pull-requests: write # opens/updates the Version PR
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job
        with:
          build-command: yarn build:gen2

      - name: Version gen2 packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f gen2/.changeset/pre.json ]; then
            (cd gen2 && yarn changeset pre enter beta)
          fi
          (cd gen2 && yarn changeset version)
          node scripts/generate-versions.js --gen=gen2
          yarn install --refresh-lockfile

      - name: Open or update the gen2 Version PR
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: release gen2 packages #gen2-publish'
          title: 'chore: release gen2 packages (beta) #gen2-publish'
          branch: changeset-release/gen2
          base: main
          delete-branch: true
          add-paths: |
            gen2
            yarn.lock

      - name: Version PR summary
        run: |
          echo "## Publish summary (gen2)" >> $GITHUB_STEP_SUMMARY
          echo "📝 Version PR opened/updated at \`changeset-release/gen2\` - nothing published yet" >> $GITHUB_STEP_SUMMARY

  # Real publish, once the Version PR above has merged (no pending changesets left).
  # This job and the snapshot job both sit behind the npm-publish environment's
  # required-reviewer approval, since both publish to npm.
  publish:
    needs: check-changesets
    # Main-only - a snapshot runs from a feature branch, so the ref check keeps them apart.
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.check-changesets.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # pushes the release git tag
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job
        with:
          build-command: yarn build:gen2

      - name: Verify NPM authentication
        id: npm-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org

      # The git-tag-existence guard is what makes this safe to re-run on every subsequent
      # ordinary push once a release has gone out - mirrors gen1's guard.
      - name: Publish gen2 packages
        if: steps.npm-auth.outcome == 'success'
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: |
          RELEASED_VERSION=$(node -p "require('./gen2/packages/swc/package.json').version")
          if git rev-parse "gen2-$RELEASED_VERSION" >/dev/null 2>&1; then
            echo "gen2-$RELEASED_VERSION already released - nothing to do."
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          yarn install --refresh-lockfile
          yarn build:gen2
          # No --tag here: changesets forbids a custom dist-tag while in pre mode
          # (throws "Releasing under custom tag is not allowed in pre mode", exit 1),
          # so `changeset publish` ships to the pre tag (beta).
          (cd gen2 && yarn changeset publish --no-git-tag)
          # Then move npm's `latest` dist-tag onto the just-published version for each
          # public gen2 package, with npm directly - the supported way to reach `latest`
          # from pre mode without editing changesets' internal pre.json state.
          while IFS= read -r pkg_json; do
            is_private=$(node -p "!!require('./$pkg_json').private")
            [ "$is_private" = "true" ] && continue
            name=$(node -p "require('./$pkg_json').name")
            version=$(node -p "require('./$pkg_json').version")
            echo "Pointing latest -> $name@$version"
            npm dist-tag add "$name@$version" latest
          done < <(find gen2/packages -maxdepth 2 -name package.json -not -path '*/node_modules/*')
          git config user.name "github-actions-bot"
          git config user.email "support+actions@github.com"
          node ./scripts/create-git-tag.js gen2
          echo "published=true" >> $GITHUB_OUTPUT

      - name: Publish summary
        if: always()
        env:
          AUTH_OUTCOME: ${{ steps.npm-auth.outcome }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          echo "## Publish summary (gen2)" >> $GITHUB_STEP_SUMMARY
          if [ "$PUBLISHED" == "false" ]; then
            echo "ℹ️ Current version already published - nothing new to ship" >> $GITHUB_STEP_SUMMARY
          elif [ "$AUTH_OUTCOME" == "success" ]; then
            echo "✅ Publish step ran - check the changeset publish output above for what shipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Publish failed — NPM authentication did not succeed" >> $GITHUB_STEP_SUMMARY
          fi
