name: Publish Packages (gen2)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '2nd-gen/**'

# Scoped to this workflow so a gen1 run and a gen2 run never block on each other -
# both used to share the same `publish-${{ github.ref }}` group string.
concurrency:
  group: publish-gen2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changesets:
    runs-on: ubuntu-latest
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for gen2 changesets
        id: check
        run: |
          # Independent of 1st-gen in every trigger - this workflow never reads
          # 1st-gen/.changeset/.
          COUNT=$(find 2nd-gen/.changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "No 2nd-gen changesets found - nothing to version"
          else
            echo "has_changesets=true" >> $GITHUB_OUTPUT
            echo "Found $COUNT 2nd-gen changeset(s)"
          fi

  # No throwaway snapshot job here (unlike gen1): once this job enters persistent pre
  # mode, changesets disallows `--snapshot`, and a non-snapshot version call would
  # collide with the real release's version. Use the `beta` tag to test pending changes.
  #
  # Real release: version-then-PR for the persistent `beta` channel, then publish once
  # that PR merges. Uses peter-evans/create-pull-request instead of changesets/action's
  # built-in PR management, since that derives its branch name only from the base
  # branch (`changeset-release/main`) - gen1 and gen2 would collide on the same branch.
  release:
    needs: check-changesets
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # commits the Version PR branch
      pull-requests: write # opens/updates the Version PR
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job

      - name: Verify NPM authentication
        id: npm-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org

      - name: Version gen2 packages
        if: needs.check-changesets.outputs.has_changesets == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f 2nd-gen/.changeset/pre.json ]; then
            (cd 2nd-gen && yarn changeset pre enter beta)
          fi
          (cd 2nd-gen && yarn changeset version)
          yarn install --refresh-lockfile

      - name: Open or update the gen2 Version PR
        if: needs.check-changesets.outputs.has_changesets == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: release gen2 packages #gen2-publish'
          title: 'chore: release gen2 packages (beta) #gen2-publish'
          branch: changeset-release/2nd-gen
          base: main
          delete-branch: true
          add-paths: |
            2nd-gen
            yarn.lock

      - name: Version PR summary
        if: needs.check-changesets.outputs.has_changesets == 'true'
        run: |
          echo "## Publish summary (gen2)" >> $GITHUB_STEP_SUMMARY
          echo "📝 Version PR opened/updated at \`changeset-release/2nd-gen\` - nothing published yet" >> $GITHUB_STEP_SUMMARY

      # No pending changesets: either nothing to do, or the Version PR above was just
      # merged - publish whatever is now on main. The git-tag-existence guard is what
      # makes this safe to re-run on every subsequent ordinary push once a release has
      # gone out - mirrors gen1's guard, now that gen2 releases carry their own tag too.
      - name: Publish gen2 packages
        if: needs.check-changesets.outputs.has_changesets == 'false' && steps.npm-auth.outcome == 'success'
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: |
          RELEASED_VERSION=$(node -p "require('./2nd-gen/packages/swc/package.json').version")
          if git rev-parse "gen2-$RELEASED_VERSION" >/dev/null 2>&1; then
            echo "gen2-$RELEASED_VERSION already released - nothing to do."
            echo "published=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          yarn install --refresh-lockfile
          yarn build
          (cd 2nd-gen && yarn changeset publish --no-git-tag --tag beta)
          git config user.name "github-actions-bot"
          git config user.email "support+actions@github.com"
          node ./2nd-gen/scripts/create-git-tag.js
          echo "published=true" >> $GITHUB_OUTPUT

      - name: Publish summary
        if: needs.check-changesets.outputs.has_changesets == 'false' && always()
        env:
          AUTH_OUTCOME: ${{ steps.npm-auth.outcome }}
          PUBLISHED: ${{ steps.publish.outputs.published }}
        run: |
          echo "## Publish summary (gen2)" >> $GITHUB_STEP_SUMMARY
          if [ "$PUBLISHED" == "false" ]; then
            echo "ℹ️ Current version already published - nothing new to ship" >> $GITHUB_STEP_SUMMARY
          elif [ "$AUTH_OUTCOME" == "success" ]; then
            echo "✅ Publish step ran - check the changeset publish output above for what shipped" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Publish failed — NPM authentication did not succeed" >> $GITHUB_STEP_SUMMARY
          fi
