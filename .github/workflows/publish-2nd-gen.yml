name: Publish Packages (2nd-gen)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'NPM dist-tag for a throwaway snapshot (e.g., next, snapshot-test)'
        required: false
        default: 'next'
  pull_request:
    types: [labeled, synchronize]
  push:
    branches:
      - main

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-changesets:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      contains(github.event.pull_request.labels.*.name, 'snapshot-release'))
    outputs:
      has_changesets: ${{ steps.check.outputs.has_changesets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for 2nd-gen changesets
        id: check
        run: |
          # Independent of 1st-gen in every trigger - this workflow never reads
          # 1st-gen/.changeset/, including for its own snapshot-release PR path.
          COUNT=$(ls -1 2nd-gen/.changeset/*.md 2>/dev/null | grep -v README | wc -l | tr -d ' ')
          if [ "$COUNT" -eq 0 ]; then
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "No 2nd-gen changesets found - skipping snapshot publish"
          else
            echo "has_changesets=true" >> $GITHUB_OUTPUT
            echo "Found $COUNT 2nd-gen changeset(s)"
          fi

  # Throwaway snapshot publish: every push to main (continuous `next`), manual
  # workflow_dispatch, and snapshot-release-labeled PRs. Never touches main, never
  # commits, never opens a PR, never enters persistent pre-release mode. Runs alongside
  # (not instead of) the `release` job below - both are triggered by the same push event
  # but never conflict (separate jobs/runners, and the run-level concurrency group only
  # dedupes overlapping *workflow runs*, not jobs within one run).
  snapshot:
    needs: check-changesets
    if: needs.check-changesets.outputs.has_changesets == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'main' }}
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job

      - name: Determine snapshot tag
        id: extract-tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "$EVENT_NAME" == "pull_request" ]; then
            WORKFLOW_TAG="snapshot-test"
          else
            WORKFLOW_TAG="${INPUT_TAG:-next}"
          fi
          echo "tag=$WORKFLOW_TAG" >> $GITHUB_OUTPUT

      - name: Verify NPM authentication
        id: npm-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org

      - name: Build all packages
        run: yarn build

      - name: Version packages (snapshot)
        working-directory: 2nd-gen
        run: yarn changeset version --snapshot ${{ steps.extract-tag.outputs.tag }}

      - name: Capture released versions
        id: versions
        run: |
          CORE_VERSION=$(node -p "require('./2nd-gen/packages/core/package.json').version")
          SWC_VERSION=$(node -p "require('./2nd-gen/packages/swc/package.json').version")
          echo "core=$CORE_VERSION" >> $GITHUB_OUTPUT
          echo "swc=$SWC_VERSION" >> $GITHUB_OUTPUT

      - name: Refresh lockfile and rebuild
        run: |
          yarn install --refresh-lockfile
          yarn build

      - name: Publish all packages
        if: steps.npm-auth.outcome == 'success'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        working-directory: 2nd-gen
        run: yarn changeset publish --no-git-tag --tag ${{ steps.extract-tag.outputs.tag }}

      - name: Publish summary
        if: always()
        env:
          TAG: ${{ steps.extract-tag.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          CORE_VERSION: ${{ steps.versions.outputs.core }}
          SWC_VERSION: ${{ steps.versions.outputs.swc }}
          AUTH_OUTCOME: ${{ steps.npm-auth.outcome }}
        run: |
          echo "## Publish summary (2nd-gen snapshot)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger** | \`${EVENT_NAME}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **NPM tag** | \`${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          [ -n "$CORE_VERSION" ] && echo "| **@adobe/spectrum-wc-core** | \`${CORE_VERSION}\` |" >> $GITHUB_STEP_SUMMARY
          [ -n "$SWC_VERSION" ] && echo "| **@adobe/spectrum-wc** | \`${SWC_VERSION}\` |" >> $GITHUB_STEP_SUMMARY

          if [ "$AUTH_OUTCOME" == "success" ]; then
            echo "✅ Publish completed with tag \`${TAG}\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Publish failed — NPM authentication did not succeed" >> $GITHUB_STEP_SUMMARY
          fi

  # Real release: version-PR-then-publish for the persistent `beta` pre-release channel,
  # driven entirely by changesets/action. Every push to main either opens/updates the
  # Version PR (changesets pending) or publishes (no changesets pending, because that PR
  # was just merged). 2nd-gen has no `latest` channel yet - `beta` is the only real release.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: write # changesets/action commits the Version PR branch
      pull-requests: write # changesets/action opens/updates the Version PR
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup job and install dependencies
        uses: ./.github/actions/setup-job

      - name: Verify NPM authentication
        id: npm-auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}
        run: npm whoami --registry=https://registry.npmjs.org

      - name: Build all packages
        run: yarn build

      - name: Version or publish 2nd-gen packages
        id: changesets
        uses: changesets/action@v1
        with:
          cwd: 2nd-gen
          commit: 'chore: release 2nd-gen packages'
          title: 'chore: release 2nd-gen packages (beta)'
          version: |
            if [ ! -f .changeset/pre.json ]; then
              yarn changeset pre enter beta
            fi
            yarn changeset version
          publish: |
            yarn install --refresh-lockfile
            yarn build
            yarn changeset publish --no-git-tag --tag beta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.ADOBE_BOT_NPM_TOKEN }}

      - name: Publish summary
        if: always()
        env:
          PUBLISHED: ${{ steps.changesets.outputs.published }}
          PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: |
          echo "## Publish summary (2nd-gen)" >> $GITHUB_STEP_SUMMARY
          if [ "$PUBLISHED" == "true" ]; then
            echo "✅ Published a new beta release" >> $GITHUB_STEP_SUMMARY
          elif [ -n "$PR_NUMBER" ] && [ "$PR_NUMBER" != "null" ]; then
            echo "📝 Version PR #${PR_NUMBER} opened/updated - nothing published yet" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No pending changesets and nothing new to publish" >> $GITHUB_STEP_SUMMARY
          fi
