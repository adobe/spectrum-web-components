name: Force unlock release branch

# Manual recovery for a stuck release lock. `if: always()` on the unlock step in
# publish.yml / publish-2nd-gen.yml covers a failed step, but not a cancelled run or a
# dead runner - in either of those cases the release/in-progress required status check
# is left on the branch forever, blocking every PR merge into it until removed by hand.
# Run this workflow manually to clear it.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to unlock'
        type: choice
        required: true
        options:
          - main
          - gen2-beta

jobs:
  unlock:
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unlock
        uses: ./.github/actions/release-branch-lock
        with:
          mode: unlock
          branch: ${{ github.event.inputs.branch }}
          token: ${{ secrets.RELEASE_BOT_TOKEN }}
