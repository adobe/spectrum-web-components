name: Type Check
#
# Language-level checks that the compiler-in-the-editor performs but that the
# vite build (esbuild, no type-checking) does not catch:
#
#   1. TypeScript — `tsc -b` build mode, so cross-package types resolve
#      through the composite project references. Reported via reviewdog,
#      diff-only: pre-existing errors elsewhere are left alone; anything the
#      PR adds is surfaced as an inline review comment and fails the check.
#   2. Lit templates — `lit-analyzer` (the CLI behind the `runem.lit-plugin`
#      IDE extension). Annotated on the PR via a problem matcher. Currently
#      non-blocking (`|| true`) while the existing backlog is cleared; drop
#      the `|| true` to gate once it is green.
#
# To triage both backlogs locally, run:
#
#   yarn type-check       # TypeScript only
#   yarn analyze:2nd-gen  # lit-analyzer only
#   yarn check:2nd-gen    # everything, including lint
#

on:
  pull_request:
    branches:
      - main

    types:
      - opened
      - synchronize
      - reopened
      - auto_merge_enabled

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  type-check:
    name: Type Check (2nd-gen)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node version from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      ## --- YARN CACHE --- ##
      - name: Check for cached dependencies
        continue-on-error: true
        id: cache-dependencies
        uses: actions/cache@v4
        with:
          path: |
            .cache/yarn
            node_modules
          key: ubuntu-latest-${{ hashFiles('.nvmrc', 'package.json', 'yarn.lock') }}

      ## --- INSTALL --- ##
      - name: Install dependencies
        run: yarn install --immutable

      - name: Set up reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      # Run the compiler and pipe its diagnostics to reviewdog. Without
      # `pipefail` the pipeline's exit status is reviewdog's, so tsc's
      # non-zero exit on the pre-existing backlog is ignored; reviewdog
      # decides pass/fail from findings within the PR diff (fail_level).
      - name: Type check with reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          yarn type-check 2>&1 \
            | reviewdog \
                -f=tsc \
                -name="tsc (2nd-gen)" \
                -reporter=github-pr-review \
                -filter-mode=diff_context \
                -level=warning \
                -fail-level=any

      # Lit-template analysis (lit-analyzer). No JSON output is available, so
      # findings are annotated natively via a problem matcher rather than
      # reviewdog. `|| true` keeps the job green while the backlog is cleared;
      # remove it to gate on lit-template errors and warnings.
      - name: Analyze Lit templates
        run: |
          echo "::add-matcher::.github/lit-analyzer-matcher.json"
          yarn analyze:2nd-gen || true
          echo "::remove-matcher owner=lit-analyzer::"
