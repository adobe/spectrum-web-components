name: Changeset check
#
# Warns (never fails) when a pull request changes publishable source in
# 1st-gen or gen2 without adding a changeset to that generation's
# `.changeset` directory.
#

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - auto_merge_enabled

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changeset_check:
    name: Check for changesets
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for changesets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # --no-renames reports a move as a delete plus an add, so moving source into an ignored path is still caught.
          changed=$(git diff --name-only --no-renames --diff-filter=AMD "$BASE_SHA...$HEAD_SHA")
          # Only newly added files count as a changeset; edits or deletions of existing ones don't.
          added=$(git diff --name-only --no-renames --diff-filter=A "$BASE_SHA...$HEAD_SHA")

          # Source changes that ship to consumers; tests, stories, and docs don't need a changeset.
          ignore_pattern='(/test/|/tests/|/stories/|/\.storybook/|/public/|\.(test|stories|vrt)\.[jt]sx?$|\.mdx?$)'
          config_pattern='/(\.npmrc|\.npmignore|\.gitignore|tsconfig[^/]*\.json|[^/]*\.config\.([cm]?[jt]s|json))$'
          private_pattern='^gen2/packages/tools/'

          missing=0
          for gen in 1st-gen gen2; do
            source_changes=$(echo "$changed" | grep -E "^${gen}/(packages|tools)/" | grep -Ev "$ignore_pattern|$config_pattern|$private_pattern" || true)
            if [ -z "$source_changes" ]; then
              continue
            fi

            changesets=$(echo "$added" | grep -E "^${gen}/\.changeset/.+\.md$" | grep -v "/README\.md$" || true)
            if [ -n "$changesets" ]; then
              echo "✅ $gen: changeset found."
              continue
            fi

            missing=1
            echo "::warning title=Missing changeset ($gen)::This PR changes $gen source but doesn't add a changeset in $gen/.changeset/. Run 'yarn changeset:$gen' if the change needs to be published."
            {
              echo "### ⚠️ Missing changeset for \`$gen\`"
              echo "This PR changes \`$gen\` source but doesn't add a changeset to \`$gen/.changeset/\`."
              echo "If the change needs to be published, add one. Otherwise, you can ignore this warning."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$missing" -eq 0 ]; then
            echo "No missing changesets."
          fi
