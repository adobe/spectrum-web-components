name: Coveralls Code Coverage

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  # Detect whether the change touches 1st-gen sources. The 1st-gen coverage report
  # only runs when files under 1st-gen/ change; gen2-only and root-level/shared
  # changes skip it (skipped jobs report success in branch-protection checks).
  detect-changes:
    runs-on: ubuntu-26.04
    outputs:
      first_gen: ${{ steps.filter.outputs.first_gen_any_changed }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Detect 1st-gen-relevant changes
        id: filter
        uses: step-security/changed-files@v47
        with:
          files_yaml: |
            first_gen:
              - '1st-gen/**'

  code-coverage-report:
    needs: detect-changes
    # Skip when only gen2 files changed. Skipped jobs report success in
    # branch-protection checks, so no extra gate job is needed.
    if: needs.detect-changes.outputs.first_gen == 'true'
    name: Generate and upload coverage report
    # Gen1's last compatible Playwright release supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7

      - name: Setup Job and Install Dependencies
        uses: ./.github/actions/setup-job

      - name: Install Playwright
        # Match the scoped Web Test Runner resolution, not the current test SDK.
        run: yarn install:browsers:1st-gen

      - name: Run unit tests with coverage
        run: cd 1st-gen && yarn test:ci --config web-test-runner.config.ci-chromium.js --group unit --coverage
        continue-on-error: true

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          allow-empty: true
