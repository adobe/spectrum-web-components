name: Setup Job
description: Common setup for all jobs
inputs:
  build-command:
    description: 'Build command to run after install. Gen2-only jobs pass `yarn build:gen2` to skip the 1st-gen build.'
    required: false
    default: 'yarn build'
runs:
  using: 'composite'
  steps:
    - name: Enable Corepack
      shell: bash
      run: corepack enable

    - name: Setup Node from .nvmrc
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'yarn'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      shell: bash
      run: yarn --immutable

    - name: Build the project
      shell: bash
      run: ${{ inputs.build-command }}
