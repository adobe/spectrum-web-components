# Setup config. One small job diffs the PR, works out which gens are affected,
# and continues the pipeline with continue_config.yml, passing the result as
# parameters. Unaffected gens are never created, so they cost nothing.
#
# We diff by hand rather than use the path-filtering orb: the rule ("a changed
# file outside the other gen and not docs-only") is a negation the orb's RE2
# path matching can't express.
version: 2.1
setup: true

jobs:
  decide:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Decide which gens are affected and continue the pipeline
          command: |
            set -e

            IS_BASE_MAIN=false

            # On main, run everything.
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              echo "Running on main; both gens will run."
              RUN_GEN1=true
              RUN_GEN2=true
              IS_BASE_MAIN=true
            else
              # Fetch origin/main to diff against. No --depth — a stale PR can
              # have a deep merge-base, and checkout already shares history.
              git fetch --quiet origin main 2>/dev/null || true

              CHANGED=$(git diff --name-only origin/main...HEAD 2>/dev/null || echo "")
              if [ -z "$CHANGED" ]; then
                echo "Could not compute diff vs origin/main; running both gens to be safe."
                RUN_GEN1=true
                RUN_GEN2=true
              else
                # Paths that don't affect either gen: docs, AI rules, changesets,
                # linter config, scripts, root-level markdown, and LICENSE.
                DOCS_PATTERN='^(CONTRIBUTOR-DOCS/|\.ai/|\.changeset/|linters/|scripts/|[^/]+\.md$|LICENSE$)'

                # A gen is affected if a changed file is outside the other gen
                # and isn't docs. Root files (package.json, yarn.lock) match
                # neither exclusion, so they flag both gens.
                REL_GEN1=$(echo "$CHANGED" | grep -v '^2nd-gen/' | grep -vE "$DOCS_PATTERN" || true)
                REL_GEN2=$(echo "$CHANGED" | grep -v '^1st-gen/' | grep -vE "$DOCS_PATTERN" || true)

                [ -n "$REL_GEN1" ] && RUN_GEN1=true || RUN_GEN1=false
                [ -n "$REL_GEN2" ] && RUN_GEN2=true || RUN_GEN2=false
              fi

              # Resolve the PR's base branch — gen2 coverage only runs when it's
              # main. Find the PR number from whatever signal is available, then
              # read its base via the GitHub API. Unknown (fork/no token) = false.
              PR_NUMBER=""
              if [ -n "$CIRCLE_PULL_REQUEST" ]; then
                PR_NUMBER=$(echo "$CIRCLE_PULL_REQUEST" | sed 's/.*\/pull\///')
              elif [ -n "$CIRCLE_PR_NUMBER" ]; then
                PR_NUMBER="$CIRCLE_PR_NUMBER"
              elif [[ "$CIRCLE_BRANCH" =~ ^pull/[0-9]+$ ]]; then
                PR_NUMBER=$(echo "$CIRCLE_BRANCH" | sed 's/pull\///')
              fi
              if [ -z "$PR_NUMBER" ] && [ -n "$GITHUB_TOKEN" ]; then
                PR_NUMBER=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls?head=$CIRCLE_PROJECT_USERNAME:$CIRCLE_BRANCH&state=open" \
                  | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')" 2>/dev/null || echo "")
              fi
              BASE=""
              if [ -n "$PR_NUMBER" ] && [ -n "$GITHUB_TOKEN" ]; then
                # 401/403 means the token is present but rejected (expired or
                # SSO-unauthorized). Hard-fail here — otherwise BASE comes back
                # empty, is_base_main defaults to false, and gen2 coverage
                # silently stops on main PRs with a green build. Forks have no
                # token, so they never reach this.
                HTTP=$(curl -s -o /tmp/pr.json -w "%{http_code}" \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls/$PR_NUMBER")
                if [ "$HTTP" = "401" ] || [ "$HTTP" = "403" ]; then
                  echo "ERROR: GitHub token rejected (HTTP $HTTP). GITHUB_TOKEN is expired or SSO-unauthorized; regenerate it in CircleCI project env vars."
                  exit 1
                fi
                BASE=$(python3 -c "import json; print(json.load(open('/tmp/pr.json')).get('base',{}).get('ref',''))" 2>/dev/null || echo "")
              fi
              echo "Resolved PR base branch: '${BASE:-<unknown>}'"
              [ "$BASE" = "main" ] && IS_BASE_MAIN=true || IS_BASE_MAIN=false
            fi

            echo "Decide which gen tests to run:"
            echo "run_gen1=$RUN_GEN1"
            echo "run_gen2=$RUN_GEN2"
            echo "Decide if gen2 chromium coverage should run:"
            echo "is_base_main=$IS_BASE_MAIN"
            export RUN_GEN1 RUN_GEN2 IS_BASE_MAIN

            # Register the merge-gate statuses on this commit. An affected gen
            # starts pending and is flipped to success by that workflow's
            # report-gen-status job; a skipped gen is marked success now so the
            # required check isn't left hanging. Needs a token, so forks (which
            # get none) skip this — see note below.
            if [ -n "$GITHUB_TOKEN" ]; then
              post_status() {
                curl -sf -X POST \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/statuses/$CIRCLE_SHA1" \
                  -d "{\"state\":\"$2\",\"context\":\"$1-tests-status\",\"description\":\"$3\"}" >/dev/null || true
              }
              [ "$RUN_GEN1" = "true" ] && post_status gen1 pending "gen1 tests running" || post_status gen1 success "gen1 not affected"
              [ "$RUN_GEN2" = "true" ] && post_status gen2 pending "gen2 tests running" || post_status gen2 success "gen2 not affected"
            fi

            # POST the continue config + resolved params to the continuation API.
            # (the heredoc operator is escaped so CircleCI emits it literally.)
            python3 - \<<'PY'
            import json, os
            params = {
                "run_gen1": os.environ["RUN_GEN1"] == "true",
                "run_gen2": os.environ["RUN_GEN2"] == "true",
                "is_base_main": os.environ["IS_BASE_MAIN"] == "true",
            }
            with open(".circleci/continue_config.yml") as f:
                configuration = f.read()
            body = {
                "continuation-key": os.environ["CIRCLE_CONTINUATION_KEY"],
                "configuration": configuration,
                "parameters": params,
            }
            with open("/tmp/continue-body.json", "w") as f:
                json.dump(body, f)
            PY

            HTTP_CODE=$(curl -sS -o /tmp/continue-response.json -w "%{http_code}" \
              -X POST https://circleci.com/api/v2/pipeline/continue \
              -H "Content-Type: application/json" \
              -d @/tmp/continue-body.json)
            echo "Continuation API responded with HTTP $HTTP_CODE"
            cat /tmp/continue-response.json || true
            echo
            # 2xx means the continuation was accepted.
            case "$HTTP_CODE" in
              2*) exit 0 ;;
              *) echo "Continuation failed"; exit 1 ;;
            esac

workflows:
  setup:
    jobs:
      - decide
