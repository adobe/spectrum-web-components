# SETUP config (dynamic configuration).
#
# This file does almost nothing on its own: a single small container diffs
# the PR against origin/main once, decides which gens are affected, and then
# "continues" the pipeline with `.circleci/continue_config.yml`, passing the
# decision as pipeline parameters. Jobs for an unaffected gen are never
# created, so they cost zero credits — replacing the old pattern where every
# gated job booted an xlarge container just to run a git diff and halt.
#
# Why a hand-rolled decision job instead of the path-filtering orb: the
# relevance rule is "a changed file exists that is NOT in the other gen's
# directory AND is not docs-only" — a negation the orb's positive-only,
# lookahead-free (RE2) path matching can't express. Reusing the original
# diff logic verbatim is both faithful and lower-risk.
version: 2.1
setup: true

jobs:
  decide:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run:
          name: Decide which gens are affected and continue the pipeline
          command: |
            set -e

            IS_BASE_MAIN=false

            # On main, run everything.
            if [ "$CIRCLE_BRANCH" = "main" ]; then
              echo "Running on main; both gens will run."
              RUN_GEN1=true
              RUN_GEN2=true
              IS_BASE_MAIN=true
            else
              # Make sure origin/main is fetched so we can diff against it.
              # No --depth: a stale PR can have a deep merge-base, and the
              # fetch is fast since CircleCI's checkout already has shared
              # history.
              git fetch --quiet origin main 2>/dev/null || true

              CHANGED=$(git diff --name-only origin/main...HEAD 2>/dev/null || echo "")
              if [ -z "$CHANGED" ]; then
                echo "Could not compute diff vs origin/main; running both gens to be safe."
                RUN_GEN1=true
                RUN_GEN2=true
              else
                # Paths that never affect either gen's tests: contributor
                # docs, AI rules/skills, changeset files, linter config,
                # scripts, root-level markdown files, and the license file.
                DOCS_PATTERN='^(CONTRIBUTOR-DOCS/|\.ai/|\.changeset/|linters/|scripts/|[^/]+\.md$|LICENSE$)'

                # A gen is affected when a changed file is outside the OTHER
                # gen's directory and is not a docs-only path. Root-level
                # files (e.g. package.json, yarn.lock) match neither
                # exclusion, so they mark BOTH gens affected.
                REL_GEN1=$(echo "$CHANGED" | grep -v '^2nd-gen/' | grep -vE "$DOCS_PATTERN" || true)
                REL_GEN2=$(echo "$CHANGED" | grep -v '^1st-gen/' | grep -vE "$DOCS_PATTERN" || true)

                [ -n "$REL_GEN1" ] && RUN_GEN1=true || RUN_GEN1=false
                [ -n "$REL_GEN2" ] && RUN_GEN2=true || RUN_GEN2=false
              fi

              # Resolve the PR base branch here (not per-job): gen2 coverage
              # only runs for PRs targeting main. The old per-job resolver
              # relied on CIRCLE_PULL_REQUEST, which CircleCI leaves empty on
              # most PR builds, so coverage was always skipped. Derive the PR
              # number from any available signal, then read its base via the
              # GitHub API. Undetermined (fork/no token) stays false.
              PR_NUMBER=""
              if [ -n "$CIRCLE_PULL_REQUEST" ]; then
                PR_NUMBER=$(echo "$CIRCLE_PULL_REQUEST" | sed 's/.*\/pull\///')
              elif [ -n "$CIRCLE_PR_NUMBER" ]; then
                PR_NUMBER="$CIRCLE_PR_NUMBER"
              elif [[ "$CIRCLE_BRANCH" =~ ^pull/[0-9]+$ ]]; then
                PR_NUMBER=$(echo "$CIRCLE_BRANCH" | sed 's/pull\///')
              fi
              if [ -z "$PR_NUMBER" ] && [ -n "$GITHUB_TOKEN" ]; then
                PR_NUMBER=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls?head=$CIRCLE_PROJECT_USERNAME:$CIRCLE_BRANCH&state=open" \
                  | python3 -c "import json,sys; d=json.load(sys.stdin); print(d[0]['number'] if d else '')" 2>/dev/null || echo "")
              fi
              BASE=""
              if [ -n "$PR_NUMBER" ] && [ -n "$GITHUB_TOKEN" ]; then
                # Capture the HTTP status separately from the body. A 401/403
                # here means the token is present but rejected — almost always
                # an expired or SSO-unauthorized GITHUB_TOKEN. Left unchecked,
                # the base lookup would silently return empty, is_base_main
                # would default to false, and gen2 coverage would silently
                # stop running on main-targeted PRs with a green build — the
                # exact silent-skip failure this job exists to prevent. So we
                # hard-fail on auth errors to surface token expiry loudly.
                # Fork PRs never reach here (no token), so they are unaffected.
                HTTP=$(curl -s -o /tmp/pr.json -w "%{http_code}" \
                  -H "Authorization: Bearer $GITHUB_TOKEN" \
                  -H "Accept: application/vnd.github+json" \
                  "https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME/pulls/$PR_NUMBER")
                if [ "$HTTP" = "401" ] || [ "$HTTP" = "403" ]; then
                  echo "ERROR: GitHub token rejected (HTTP $HTTP). GITHUB_TOKEN is expired or SSO-unauthorized; regenerate it in CircleCI project env vars."
                  exit 1
                fi
                BASE=$(python3 -c "import json; print(json.load(open('/tmp/pr.json')).get('base',{}).get('ref',''))" 2>/dev/null || echo "")
              fi
              echo "Resolved PR base branch: '${BASE:-<unknown>}'"
              [ "$BASE" = "main" ] && IS_BASE_MAIN=true || IS_BASE_MAIN=false
            fi

            echo "run_gen1=$RUN_GEN1"
            echo "run_gen2=$RUN_GEN2"
            echo "is_base_main=$IS_BASE_MAIN"
            export RUN_GEN1 RUN_GEN2 IS_BASE_MAIN

            # Build the continuation request: the continue config content plus
            # the resolved pipeline parameters, POSTed to the continuation API.
            # (the heredoc operator is escaped so CircleCI emits it literally.)
            python3 - \<<'PY'
            import json, os
            params = {
                "run_gen1": os.environ["RUN_GEN1"] == "true",
                "run_gen2": os.environ["RUN_GEN2"] == "true",
                "is_base_main": os.environ["IS_BASE_MAIN"] == "true",
            }
            with open(".circleci/continue_config.yml") as f:
                configuration = f.read()
            body = {
                "continuation-key": os.environ["CIRCLE_CONTINUATION_KEY"],
                "configuration": configuration,
                "parameters": params,
            }
            with open("/tmp/continue-body.json", "w") as f:
                json.dump(body, f)
            PY

            HTTP_CODE=$(curl -sS -o /tmp/continue-response.json -w "%{http_code}" \
              -X POST https://circleci.com/api/v2/pipeline/continue \
              -H "Content-Type: application/json" \
              -d @/tmp/continue-body.json)
            echo "Continuation API responded with HTTP $HTTP_CODE"
            cat /tmp/continue-response.json || true
            echo
            # 2xx means the continuation was accepted.
            case "$HTTP_CODE" in
              2*) exit 0 ;;
              *) echo "Continuation failed"; exit 1 ;;
            esac

workflows:
  setup:
    jobs:
      - decide
