<!-- Apply the Theme toolbar value from the URL before the stylesheets and
     Storybook load, so a non-default theme doesn't flash light first.
     `withContext` and `SpectrumDocsContainer` keep the class in sync after. -->
<script>
  (() => {
    const globals = new URLSearchParams(window.location.search).get('globals');
    const theme = /(?:^|;)theme:(light|dark|adaptive)(?:;|$)/.exec(
      globals ?? ''
    )?.[1];
    if (theme) {
      document.documentElement.classList.add(`swc-theme--${theme}`);
    }
  })();
</script>
<style>
  /* Mirrors swc.css, which loads later with the preview module */
  :root.swc-theme--dark {
    color-scheme: dark;
  }

  :root.swc-theme--adaptive {
    color-scheme: light dark;
  }
</style>

<!-- This preconnect opens the connection for typekit to more quickly load fonts -->
<link rel="preconnect" href="https://use.typekit.net" crossorigin />
<link rel="dns-prefetch" href="https://use.typekit.net" />
<!-- For Adobe Clean Spectrum VF font support. CJK kits are loaded on-demand by the language decorator. -->
<link rel="stylesheet" href="https://use.typekit.net/obc6cux.css" />
<!-- This is the script that attempts to pre-load the typekit fonts -->
<script>
  window.global = window;

  let isLoading = false;

  /**
   * Adobe Fonts kit IDs by locale. Used to load the correct font project when the user changes language in Storybook.
   * Latin/default is loaded in preview-head; CJK kits are loaded on-demand by the language decorator (which injects the
   * corresponding kit script when the Language toolbar value changes).
   */
  window.__SWC_FONT_KIT_IDS__ = {
    default: 'obc6cux',
    en: 'obc6cux',
    'en-US': 'obc6cux',
    ar: 'obc6cux',
    he: 'obc6cux',
    ja: 'fhs4zuy',
    ko: 'cbs0ykg',
    'zh-Hant': 'ueg0fjf',
    'zh-TW': 'ueg0fjf',
    zh: 'ueg0fjf',
    'zh-Hans': 'dck3siu',
    'zh-CN': 'dck3siu',
    'zh-HK': 'kje4xva',
  };

  window.getKitIdForLang = function (lang) {
    if (!lang) {
      return window.__SWC_FONT_KIT_IDS__.default;
    }
    return (
      window.__SWC_FONT_KIT_IDS__[lang] || window.__SWC_FONT_KIT_IDS__.default
    );
  };

  const script = document.createElement('script');
  script.src = '//use.typekit.net/obc6cux.js';
  script.type = 'text/javascript';
  script.async = 'true';
  script.onload = script.onreadystatechange = function () {
    const readyState = this.readyState;
    if (
      isLoading ||
      (readyState && readyState != 'complete' && readyState != 'loaded')
    )
      return;
    isLoading = true;

    try {
      Typekit.load({
        kitId: 'obc6cux',
        async: true,
        scriptTimeout: 3000,
        // https://github.com/typekit/webfontloader?tab=readme-ov-file#configuration
        loading: function () {
          window.FontsLoading = true;
        },
        active: function () {
          window.FontsLoading = false;
          window.currentKitId = this.kitId;
          console.log(`Font loaded [id: ${window.currentKitId}]`);

          // Fire a custom event to indicate the Adobe Fonts have loaded
          document.dispatchEvent(
            new CustomEvent('typekit-loaded', {
              detail: { kitId: this.kitId },
            })
          );
        },
      });
    } catch (e) {
      console.log('Typekit failed to load:', e);
    }
  };

  const firstScript = document.getElementsByTagName('script')[0];
  firstScript.parentNode.insertBefore(script, firstScript);
</script>
